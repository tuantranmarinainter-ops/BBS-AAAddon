plugins {
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version + "-" + minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven { url "https://maven.architectury.dev/" }
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bbs-aaaddon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}
configurations.all {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.lwjgl') {
                details.useVersion '3.3.1'
            }
        }
    }
}


fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Release jars use intermediary mappings; Loom remaps them for development.
	if (!file(project.bbs_dev_jar).isFile()) {
		throw new GradleException("Missing BBS FS jar: ${project.bbs_dev_jar}. Place the release jar in libs/ or set -Pbbs_dev_jar=<path>.")
	}
	modImplementation files(project.bbs_dev_jar)

	// Optional shader integrations that BBS mixins target; required for the dev runtime.
	modImplementation "maven.modrinth:sodium:mc1.20.1-0.5.13-fabric"
	modImplementation "maven.modrinth:iris:1.7.6+1.20.1"
	modImplementation "org.anarres:jcpp:1.4.14"
	modImplementation "io.github.douira:glsl-transformer:2.0.0-pre13"

	modImplementation "maven.modrinth:aaa-particles:fabric-1.20.1-2.2.3"
	modImplementation "dev.architectury:architectury-fabric:9.2.14"
	modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.0"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
